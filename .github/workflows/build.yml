name: Build

on:
    push:
        branches: ["**"]
        tags: ["**"]
        paths-ignore: ["**.md"]
    workflow_call:
    workflow_dispatch:
        inputs:
            publish:
                description: 'Publish to Packages as a snapshot'
                type: boolean
                required: false
                default: false

            release:
                description: 'Publish a release with this tag'
                type: string
                required: false
                default: ''

            skip-natives-cache:
                description: 'Force a full rebuild of natives, bypassing the cache'
                type: boolean
                required: false
                default: false

permissions:
    contents: read
    packages: read

jobs:
    check-natives-cache:
        runs-on: ubuntu-latest
        outputs:
            cache-hit: ${{ steps.check.outputs.cache-hit }}
            cache-key: ${{ steps.cache-key.outputs.key }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Compute natives cache key
              id: cache-key
              run: |
                  KEY="natives-resources-v2-${{ hashFiles('natives/**', '.github/workflows/build-natives.yml') }}"
                  echo "key=$KEY" >> "$GITHUB_OUTPUT"

            - name: Check natives cache
              id: cache-natives
              if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip-natives-cache != true }}
              uses: actions/cache/restore@v6
              with:
                  path: main/build/embedded-natives
                  key: ${{ steps.cache-key.outputs.key }}
                  lookup-only: true

            - name: Determine cache hit
              id: check
              run: |
                  if [ "${{ steps.cache-natives.outputs.cache-hit }}" = "true" ]; then
                    echo "cache-hit=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "cache-hit=false" >> "$GITHUB_OUTPUT"
                  fi

    build-natives:
        needs: check-natives-cache
        if: needs.check-natives-cache.outputs.cache-hit != 'true'
        permissions:
            contents: read
        uses: ./.github/workflows/build-natives.yml
        with:
            skip-cache: ${{ inputs.skip-natives-cache || false }}

    build:
        needs: [check-natives-cache, build-natives]
        if: always() && needs.check-natives-cache.result == 'success' && (needs.build-natives.result == 'success' || needs.build-natives.result == 'skipped')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Restore natives from cache
              if: needs.check-natives-cache.outputs.cache-hit == 'true'
              uses: actions/cache/restore@v6
              with:
                  path: main/build/embedded-natives
                  key: ${{ needs.check-natives-cache.outputs.cache-key }}
                  fail-on-cache-miss: true

            - name: Download natives from build artifact
              if: needs.check-natives-cache.outputs.cache-hit != 'true'
              uses: actions/download-artifact@v8
              with:
                  name: natives-resources
                  path: main/build/embedded-natives

            - name: Save natives to cache
              if: needs.check-natives-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: main/build/embedded-natives
                  key: ${{ needs.check-natives-cache.outputs.cache-key }}

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: zulu
                  java-version: 17  # gradle 9 requires Java 17
                  cache: gradle

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  cache-provider: 'basic'

            - name: Build project
              run: ./gradlew build

            - name: Publish packages
              if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.publish == true || inputs.release != '')) }}
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: auto
                  AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
                  R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
                  RELEASE_VERSION: ${{ inputs.release }}
                  GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
                  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  snapshot_flag="false"
                  target_prefix="releases"
                  if [[ "$GITHUB_REF" != refs/tags/* && -z "$RELEASE_VERSION" ]]; then
                    snapshot_flag="true"
                    target_prefix="snapshots"

                    # If this is a branch push and HEAD is tagged with a release tag,
                    # skip snapshot publishing to prevent colliding with the release workflow.
                    matching_tag=$(git tag --points-at HEAD | grep -v -- '-SNAPSHOT' | head -n 1 || true)
                    if [[ -n "$matching_tag" ]]; then
                      echo "Commit is tagged as '$matching_tag'; skipping snapshot publishing for branch push."
                      exit 0
                    fi
                  fi

                  staging_dir="$RUNNER_TEMP/r2-staging"
                  rm -rf "$staging_dir"
                  mkdir -p "$staging_dir"

                  echo "Publishing Lavaplayer to target prefix: $target_prefix (snapshot: $snapshot_flag)"

                  modules=("lavaplayer" "lava-common" "lavaplayer-ext-format-xm")
                  for module in "${modules[@]}"; do
                    metadata_path="org/lolicode/$module/maven-metadata.xml"
                    mkdir -p "$staging_dir/org/lolicode/$module"
                    if aws s3 cp "s3://$R2_BUCKET/$target_prefix/$metadata_path" "$staging_dir/$metadata_path" --endpoint-url "$AWS_ENDPOINT_URL" 2>/dev/null; then
                      echo "Fetched existing $metadata_path from R2"
                    else
                      echo "No existing $metadata_path found on R2 ($target_prefix)"
                    fi
                  done

                  gradle_args=("-PstagingDir=$staging_dir")
                  if [[ -n "$RELEASE_VERSION" ]]; then
                    gradle_args+=("-Plavaplayer.version=$RELEASE_VERSION")
                  fi
                  ./gradlew publish "${gradle_args[@]}"

                  if [[ "$snapshot_flag" == "false" ]]; then
                    aws s3 sync "$staging_dir" "s3://$R2_BUCKET/$target_prefix" \
                      --endpoint-url "$AWS_ENDPOINT_URL" \
                      --exclude "*/maven-metadata.xml*" \
                      --cache-control "public, max-age=31536000, immutable"

                    aws s3 sync "$staging_dir" "s3://$R2_BUCKET/$target_prefix" \
                      --endpoint-url "$AWS_ENDPOINT_URL" \
                      --exclude "*" \
                      --include "*/maven-metadata.xml*" \
                      --cache-control "public, max-age=300, must-revalidate"
                  else
                    aws s3 sync "$staging_dir" "s3://$R2_BUCKET/$target_prefix" \
                      --endpoint-url "$AWS_ENDPOINT_URL" \
                      --cache-control "public, max-age=300, must-revalidate"
                  fi

            - name: Upload Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: lavaplayer-artifacts
                  path: |
                      main/build/libs/lavaplayer-*.jar
                      common/build/libs/lava-common-*.jar
                      extensions/format-xm/build/libs/lavaplayer-ext-format-xm-*.jar

    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        if: ${{ always() && needs.build.result == 'success' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release != '')) }}
        steps:
            - name: Get the tag name
              id: get_tag
              run: |
                    if [ "${{ github.event_name }}" = "push" ]; then
                        echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
                    elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                        echo "TAG_NAME=${{ inputs.release }}" >> $GITHUB_ENV
                    else
                        echo "TAG_NAME=unknown" >> $GITHUB_ENV
                    fi

            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: lavaplayer-artifacts
                  path: release-artifacts

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
              with:
                  tag_name: ${{ env.TAG_NAME }}
                  files: "release-artifacts/**/*.jar"
